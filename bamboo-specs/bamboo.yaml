---
version: 2
plan:
  project-key: MAC
  key: SFM
  name: Sentry-Cocoa for Mac
  description: Clone of sentry-cocoa to build a static framework for Mac
stages:
  - Build Stage:
      manual: false
      final: false
      jobs:
        - Build Job

Build Job:
  key: JOB1
  tasks:
    - checkout:
        description: Checkout Default Repository
        force-clean-build: 'true'
    - script: |
          #!/usr/bin/arch -arm64 /bin/zsh
          OUTDIR=Carthage
          XCF_NAME=Sentry.xcframework
          UPLOAD_PATH="https://art.int.agrd.dev/artifactory/adguard-pods/binaries/SentryCocoaMac"

          # - Build
          ./scripts/build-xcframework.sh

          # - Archive
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString:" `find ${OUTDIR}/${XCF_NAME}  -path '*/Resources/Info.plist' | head -1`)
          AG_VER="ag001"
          XCF_ARCHIVE_NAME=Sentry-${VER}-${AG_VER}.xcframework.zip

          /usr/bin/ditto -c -k --keepParent "${OUTDIR}/${XCF_NAME}" \
              "${OUTDIR}/${XCF_ARCHIVE_NAME}" || exit 1

          # - Upload to Artifactory
          curl -u"${bamboo_artifactoryUser}":"${bamboo_artifactoryPassword}" \
              -XPUT "${UPLOAD_PATH}/${XCF_ARCHIVE_NAME}" \
              -T "${OUTDIR}/{$XCF_ARCHIVE_NAME}" \
              || exit 1

          # - Create local artifact on Bamboo w/o version number
          mv "${OUTDIR}/${XCF_ARCHIVE_NAME}" "${OUTDIR}/${XCF_NAME}.zip"
  artifacts:
    - name: Sentry.xcframework.zip
      location: Carthage
      pattern: Sentry.xcframework.zip
      shared: true
      required: true
  requirements:
    - ARM
repositories:
  - mac-sentry-cocoa:
      scope: global
branches:
  create: for-pull-request
  delete:
    after-deleted-days: 1
    after-inactive-days: 30
  link-to-jira: true
notifications: []
labels: []
other:
  concurrent-build-plugin: system-default
...
